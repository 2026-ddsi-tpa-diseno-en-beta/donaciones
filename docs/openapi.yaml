components:
  schemas:
    ProductoRequest:
      type: object
      properties:
        id:
          type: string
        nombre:
          type: string
        descripcion:
          type: string
        categoriaID:
          type: string
        subcategoriaID:
          type: string
        identificadorID:
          type: string
    ProductoResponse:
      type: object
      properties:
        id:
          type: string
        nombre:
          type: string
        descripcion:
          type: string
        categoriaID:
          type: string
        subcategoriaID:
          type: string
        identificadorID:
          type: string
    IdentificadorDTO:
      type: object
      properties:
        id:
          type: string
        tipo:
          type: string
          enum:
            - QR
            - CODIGODEBARRAS
        descripcion:
          type: string
    CategoriaRequest:
      type: object
      properties:
        id:
          type: string
        nombre:
          type: string
        descripcion:
          type: string
        categoriaPadreID:
          type: string
        subcategoriaID:
          type: string
    CategoriaResponse:
      type: object
      properties:
        id:
          type: string
        nombre:
          type: string
        descripcion:
          type: string
        categoriaPadreID:
          type: string
        esSubcategoria:
          type: boolean
    DonacionDTO:
      type: object
      properties:
        id:
          type: string
        donadorID:
          type: string
        depositoID:
          type: string
        descripcion:
          type: string
        productoID:
          type: string
        cantidad:
          type: integer
          format: int32
        estado:
          type: string
          enum:
            - INGRESADA
            - ACEPTADA
            - CONQUEJA
    QuejaRequest:
      type: object
      properties:
        descripcion:
          type: string
    ProductoDTO:
      type: object
      properties:
        id:
          type: string
        nombre:
          type: string
        descripcion:
          type: string
        categoriaID:
          type: string
        identificadorID:
          type: string
    CambioEstadoResponse:
      type: object
      properties:
        estado:
          type: string
        fechaCambio:
          type: string
          format: date-time
        detalle:
          type: string
