      operationId: cambiarEstado
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: estado
          in: query
          required: true
          schema:
            type: string
            enum:
              - INGRESADA
              - ACEPTADA
              - CONQUEJA
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/DonacionDTO"
  "/donaciones/{id}":
    get:
      tags:
        - donaciones-controller
      operationId: buscarDonacionPorID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
