# Especificacion OpenAPI del Servicio de Donaciones.
# Swagger UI: https://donaciones-xouj.onrender.com/swagger-ui/index.html

openapi: "3.1.0"
info:
  title: "DonaTrack - Servicio de Donaciones"
  version: "1.1.0"
  description: "API del componente de Donaciones. Los IDs de las altas son generados por el servidor."
servers:
  - url: "https://donaciones-xouj.onrender.com"
    description: Render
  - url: "http://localhost:8080"
    description: Local
paths:
  "/donaciones":
    get:
      tags: [donaciones]
      summary: Lista donaciones o filtra por donador y fecha
      description: "Sin parametros lista todas. Para filtrar se deben enviar juntos donadorID y fecha. El resultado se ordena cronologicamente."
      parameters:
        - name: donadorID
          in: query
          required: false
          schema:
            type: string
        - name: fecha
          in: query
          required: false
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Donaciones ordenadas cronologicamente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DonacionDTO"
    post:
      tags: [donaciones]
      summary: Registra una donacion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DonacionDTO"
      responses:
        "201":
          description: Donacion registrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DonacionDTO"
  "/donaciones/{id}":
    get:
      tags: [donaciones]
      summary: Busca una donacion por ID
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Donacion encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DonacionDTO"
  "/donaciones/{id}/historial":
    get:
      tags: [donaciones]
      summary: Obtiene el historial de estados
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Historial completo
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CambioEstadoResponse"
  "/donaciones/{id}/estado":
    patch:
      tags: [donaciones]
      summary: Confirma la aceptacion informada por Logistica
      parameters:
        - $ref: "#/components/parameters/Id"
        - name: estado
          in: query
          required: true
          schema:
            type: string
            enum: [ACEPTADA]
      responses:
        "200":
          description: Donacion aceptada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DonacionDTO"
  "/donaciones/{id}/quejas":
    post:
      tags: [donaciones]
      summary: Registra una queja sobre una donacion aceptada
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuejaRequest"
      responses:
        "200":
          description: Queja registrada y donacion actualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DonacionDTO"
  "/productos":
    get:
      tags: [productos]
      summary: Lista productos
      responses:
        "200":
          description: Productos con su clasificacion completa
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProductoResponse"
    post:
      tags: [productos]
      summary: Crea un producto
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductoRequest"
      responses:
        "201":
          description: Producto creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductoResponse"
  "/productos/{id}":
    get:
      tags: [productos]
      summary: Busca un producto por ID
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Producto encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductoResponse"
    put:
      tags: [productos]
      summary: Modifica un producto
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductoRequest"
      responses:
        "200":
          description: Producto modificado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductoResponse"
    delete:
      tags: [productos]
      summary: Elimina un producto sin donaciones asociadas
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Producto eliminado
  "/categorias":
    get:
      tags: [categorias]
      summary: Lista categorias
      responses:
        "200":
          description: Categorias
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CategoriaResponse"
    post:
      tags: [categorias]
      summary: Crea una categoria o subcategoria
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoriaRequest"
      responses:
        "201":
          description: Categoria creada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoriaResponse"
  "/categorias/{id}":
    get:
      tags: [categorias]
      summary: Busca una categoria por ID
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Categoria encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoriaResponse"
    put:
      tags: [categorias]
      summary: Modifica nombre y descripcion
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoriaUpdateRequest"
      responses:
        "200":
          description: Categoria modificada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoriaResponse"
    delete:
      tags: [categorias]
      summary: Elimina una categoria sin referencias
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Categoria eliminada
  "/categorias/{id}/subcategorias":
    get:
      tags: [categorias]
      summary: Lista las subcategorias de una categoria
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Subcategorias
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CategoriaResponse"
  "/identificadores":
    get:
      tags: [identificadores]
      summary: Lista identificadores
      responses:
        "200":
          description: Identificadores
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IdentificadorDTO"
    post:
      tags: [identificadores]
      summary: Crea un identificador
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IdentificadorRequest"
      responses:
        "201":
          description: Identificador creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentificadorDTO"
  "/identificadores/{id}":
    get:
      tags: [identificadores]
      summary: Busca un identificador por ID
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Identificador encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentificadorDTO"
    put:
      tags: [identificadores]
      summary: Modifica un identificador
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IdentificadorRequest"
      responses:
        "200":
          description: Identificador modificado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentificadorDTO"
    delete:
      tags: [identificadores]
      summary: Elimina un identificador sin referencias
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Identificador eliminado
  "/admin/estado":
    get:
      tags: [administracion]
      summary: Consulta conteos y estado de integraciones
      responses:
        "200":
          description: Estado del modulo
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  "/admin/datos":
    delete:
      tags: [administracion]
      summary: Elimina los datos del modulo
      responses:
        "204":
          description: Datos eliminados
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
  schemas:
    DonacionDTO:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        donadorID:
          type: string
        depositoID:
          type: string
        descripcion:
          type: string
        productoID:
          type: string
        cantidad:
          type: integer
          format: int32
          minimum: 1
        estado:
          type: string
          readOnly: true
          enum: [INGRESADA, ACEPTADA, CONQUEJA]
    QuejaRequest:
      type: object
      required: [descripcion]
      properties:
        descripcion:
          type: string
          minLength: 1
    CambioEstadoResponse:
      type: object
      properties:
        estado:
          type: string
          enum: [INGRESADA, ACEPTADA, CONQUEJA]
        fechaCambio:
          type: string
          format: date-time
        detalle:
          type: string
    ProductoRequest:
      type: object
      required: [nombre, descripcion, categoriaID]
      properties:
        nombre:
          type: string
          minLength: 1
        descripcion:
          type: string
          minLength: 1
        categoriaID:
          type: string
          minLength: 1
        subcategoriaID:
          type: string
          description: "Obligatoria solo cuando la categoria tiene subcategorias."
        identificadorID:
          type: string
          description: Opcional
    ProductoResponse:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        nombre:
          type: string
        descripcion:
          type: string
        categoriaID:
          type: string
        subcategoriaID:
          type: string
        identificadorID:
          type: string
    CategoriaRequest:
      type: object
      required: [nombre, descripcion]
      properties:
        nombre:
          type: string
          minLength: 1
        descripcion:
          type: string
          minLength: 1
        categoriaPadreID:
          type: string
          description: "Si se informa, la nueva categoria se crea como subcategoria."
    CategoriaUpdateRequest:
      type: object
      required: [nombre, descripcion]
      properties:
        nombre:
          type: string
          minLength: 1
        descripcion:
          type: string
          minLength: 1
    CategoriaResponse:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        nombre:
          type: string
        descripcion:
          type: string
        categoriaPadreID:
          type: string
        esSubcategoria:
          type: boolean
    IdentificadorRequest:
      type: object
      required: [tipo, descripcion]
      properties:
        tipo:
          type: string
          enum: [QR, CODIGODEBARRAS]
        descripcion:
          type: string
          minLength: 1
    IdentificadorDTO:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        tipo:
          type: string
          enum: [QR, CODIGODEBARRAS]
        descripcion:
          type: string
