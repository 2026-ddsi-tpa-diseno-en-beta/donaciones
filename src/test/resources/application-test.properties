# Perfil de test: H2 en memoria. El perfil 'test' habilita las fachadas locales, por lo que el
# contexto puede levantar sin las URLs de los otros componentes.
spring.datasource.url=jdbc:h2:mem:donaciones-test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
management.datadog.metrics.export.enabled=false
