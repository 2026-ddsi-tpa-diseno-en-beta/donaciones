# ---------------------------------------------------------------- Base de datos
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:testdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

# ---------------------------------------------------------------- Actuator
# Solo lo necesario. Con include=* quedaban publicos /actuator/env (que filtra el connection
# string y la API key de Datadog) y /actuator/heapdump, sin autenticacion.
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.metrics.tags.application=donaciones
management.metrics.tags.service=donaciones
management.metrics.tags.env=${DD_ENV:prod}

# Datadog: apagado por defecto para no loguear errores cada 30s cuando no hay API key.
management.datadog.metrics.export.enabled=${DATADOG_ENABLED:false}
management.datadog.metrics.export.api-key=${DATADOG_API_KEY:}
management.datadog.metrics.export.uri=${DATADOG_URI:https://api.us5.datadoghq.com}
management.datadog.metrics.export.step=30s

# ---------------------------------------------------------------- OpenAPI
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

# Los requests propios no aceptan campos desconocidos (por ejemplo, IDs definidos por clientes).
spring.jackson.deserialization.fail-on-unknown-properties=true

# ---------------------------------------------------------------- Integraciones
# Obligatorias fuera de los perfiles dev/test: sin ellas el modulo arrancaria con fachadas de
# prueba que aceptan cualquier donador. Ver FachadasExternasConfig.
donatrack.donadores-y-entidades.url=${DONADORES_Y_ENTIDADES_URL:}
donatrack.logistica.url=${LOGISTICA_URL:}

# ---------------------------------------------------------------- Servidor
server.port=${PORT:8080}
